spring.application.name=TiendaHazel
#para definir el puerto donde "escuchará" el servidor
server.port=30
#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm
#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off
#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop
#Usuario y clave de creaTablas.sql	
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.
 
#Driver y platadorma de comunicación	
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=tue
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=tienda-hazel-2b4df.firebasestorage.app
firebase.storage.path=tienda-hazel
firebase.json.path=firebase
firebase.json.file=tienda-hazel-2b4df-firebase-adminsdk-fbsvc-ccf9363b19.json

